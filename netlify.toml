# Netlify: pubblica dist/ (preparata da prepara.sh). Il modulo usa Netlify Forms.
[build]
  command = "sh prepara.sh"
  publish = "dist"

# Font e icone non cambiano: cache lunga
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
